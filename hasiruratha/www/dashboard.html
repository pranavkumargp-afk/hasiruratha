<!-- no-cache: 1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasiru Ratha</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#10281d;--moss:#0b4a34;--leaf:#16a34a;--bg:#f2f6f0;--mute:#5d7066;--line:#dfe8dc}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
h1,h2,h3,.big{font-family:'Bricolage Grotesque',sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{background:var(--moss);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 64px}
header .wrap{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;background:#e6f4ea;color:var(--moss);display:grid;place-items:center;font:800 18px 'Bricolage Grotesque'}
header h1{font-size:20px;line-height:1.1}header small{opacity:.8}
.sp{flex:1}
.hb{background:rgba(255,255,255,.15);border:0;color:#fff;padding:9px 14px;border-radius:12px;cursor:pointer;font:600 13px Figtree;text-decoration:none}
:focus-visible{outline:3px solid #86efac;outline-offset:2px}
.hero{background:#fff;border-radius:22px;margin-top:-48px;padding:18px 20px;box-shadow:0 10px 30px rgba(11,74,52,.12)}
.hero-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.big{font-size:54px;font-weight:800;line-height:.9;color:var(--moss)}
.hero-top p{color:var(--mute);padding-bottom:4px}
.mini{margin-left:auto;display:flex;gap:20px}
.mini b{display:block;font:800 22px 'Bricolage Grotesque'}.mini span{font-size:12px;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin-top:16px;background:var(--line);gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute)}
.legend s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.alert{background:#fff7ed;border:1px solid #fdba74;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13px}
.alert pre{white-space:pre-wrap;margin-top:6px;font-size:12px;color:#7c2d12}
.view{display:none;margin-top:18px}.view.on{display:block}
#map{height:46vh;min-height:320px;border-radius:20px;border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font:600 14px Figtree;cursor:pointer;color:var(--ink);white-space:nowrap}
.pill.on{background:var(--moss);color:#fff;border-color:var(--moss)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.zc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.zc:hover{border-color:var(--leaf)}.zc h3{font-size:16px}.zc p{color:var(--mute);font-size:13px}
.tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#fff1e6;color:#ea580c}
.list{display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--bc,#2563eb);border-radius:16px;padding:14px 16px}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch h3{font-size:17px;flex:1;min-width:140px}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--b,#eee);color:#fff}
.type{font-size:12px;font-weight:600;color:var(--bc);background:#f1f5f9;padding:3px 9px;border-radius:99px}
.sub{color:var(--mute);margin-top:4px}
.note{background:#eef7f0;border-left:3px solid var(--leaf);border-radius:8px;padding:8px 12px;margin-top:10px;font-style:italic;font-size:14px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute);align-items:center}
.code{background:#eef2ee;border-radius:6px;padding:2px 7px;font-family:ui-monospace,monospace}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.acts button,.acts a{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font:600 13px Figtree;cursor:pointer;color:var(--ink);text-decoration:none}
.acts .on{background:var(--moss);color:#fff;border-color:var(--moss)}
.person{display:flex;gap:14px}
.av{width:46px;height:46px;border-radius:50%;background:#e0f2e6;color:var(--moss);display:grid;place-items:center;font:800 16px 'Bricolage Grotesque';flex:none}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--mute)}
.sr{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;margin:8px 0}
.sr i{display:block;height:10px;border-radius:99px}
h2{font-size:22px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:1000}
nav .wrap{display:flex;justify-content:space-around;align-items:center;height:68px}
nav button{background:none;border:0;display:grid;gap:2px;justify-items:center;font:600 11px Figtree;color:var(--mute);cursor:pointer;padding:6px 10px}
nav button span{font-size:20px}nav button.on{color:var(--moss)}
nav a.add{width:54px;height:54px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font:600 30px/1 sans-serif;text-decoration:none;margin-top:-26px;box-shadow:0 8px 18px rgba(22,163,74,.45)}
@media(max-width:520px){.big{font-size:44px}.mini{margin-left:0}.sr{grid-template-columns:90px 1fr 30px}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .8s ease}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">HR</div>
  <div><h1>Hasiru Ratha</h1><small id="who">Loading…</small></div>
  <div class="sp"></div>
  <button class="hb" id="refresh">Refresh</button>
  <button class="hb" id="out">Sign out</button>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="hero-top">
      <div class="big" id="total">0</div><p>trees planted</p>
      <div class="mini">
        <div><b id="s-sites">0</b><span>sites</span></div>
        <div><b id="s-planned" style="color:#ea580c">0</b><span>planned</span></div>
        <div><b id="s-done" style="color:#16a34a">0</b><span>completed</span></div>
      </div>
    </div>
    <div class="bar" id="bar"></div><div class="legend" id="legend"></div>
  </section>
  <div id="alert"></div>

  <section class="view on" id="v-map">
    <div class="chips"><button class="pill" id="near">Near me</button><button class="pill on" id="all">Show all</button></div>
    <div id="map"></div><div class="grid" id="zones"></div>
  </section>
  <section class="view" id="v-sites"><h2>Sites</h2><div class="chips" id="chips"></div><div class="list" id="sites"></div></section>
  <section class="view" id="v-trees"><h2 id="th">My trees</h2><div class="list" id="trees"></div></section>
  <section class="view" id="v-team"><h2>Registered volunteers</h2><div class="list" id="team"></div></section>
  <section class="view" id="v-stats"><h2>Stats</h2><div id="stats"></div></section>
</main>

<nav><div class="wrap">
  <button data-v="map" class="on"><span>🗺</span>Map</button>
  <button data-v="sites"><span>🌳</span>Sites</button>
  <a class="add" href="/hasiruratha?open_add=1" aria-label="Add a site">+</a>
  <button data-v="trees"><span>🌱</span>My trees</button>
  <button data-v="team" id="n-team"><span>👥</span>Team</button>
  <button data-v="stats"><span>📊</span>Stats</button>
</div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=(r,k)=>{for(const x of k)if(r[x]!=null&&r[x]!=='')return r[x];return ''};
const COL={identified:'#d97706',planned:'#ea580c',completed:'#16a34a',monitoring:'#7c3aed',hold:'#64748b',merged:'#0ea5e9',urgent:'#dc2626',healthy:'#16a34a',active:'#16a34a'};
const low=s=>String(s||'').toLowerCase();
const col=s=>COL[low(s)]||'#64748b';
// field name guesses: add yours at the front if something shows empty
const F={
 name:['site_name','title','location_name','spot_name','tree_name','volunteer_name','full_name','zone_name','name'],
 status:['status','workflow_state'],type:['site_type','type','kind','category'],
 zone:['zone','area','hr_zone','locality'],site:['site','hr_site'],
 note:['notes','remarks','description','details','comments'],code:['site_code','code','id_code','name'],
 prio:['priority'],addr:['address','location','landmark','place'],
 lat:['latitude','lat'],lng:['longitude','lng','lon','long'],
 phone:['phone','mobile','mobile_no','contact','phone_number'],email:['email','email_id'],
 species:['species','tree_species','tree_type']
};
const g=(r,k)=>pick(r,F[k]);
let D,map,layer,zoneF=null,siteF='All';

async function load(){
  let r;try{r=await fetch('/api/method/hasiruratha.dashboard_api.get_dashboard')}catch(e){return fail('No connection to the server.')}
  if(r.status===401||r.status===403){location='/hasiruratha';return}
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.message){
    let m=j.exception||j._error_message||'';
    if(!m&&j._server_messages){try{m=JSON.parse(JSON.parse(j._server_messages)[0]).message}catch(e){}}
    return fail(m||'Server error '+r.status+'. Check the bench terminal for the traceback.');
  }
  D=j.message;
  $('#who').textContent=D.user+' · '+(D.is_admin?'Admin':'Volunteer');
  $('#n-team').style.display=D.is_admin?'':'none';
  render();
}
function fail(m){$('#who').textContent='Could not load data';$('#alert').innerHTML=`<div class="alert"><b>Dashboard could not load.</b><pre>${esc(m)}</pre></div>`}

function render(){
  const T=D.trees.length,S=D.sites,cnt=k=>S.filter(s=>low(g(s,'status'))===k).length;
  $('#total').textContent=T;$('#s-sites').textContent=S.length;
  $('#s-planned').textContent=cnt('planned');$('#s-done').textContent=cnt('completed');
  const keys=['identified','planned','completed','monitoring','hold','merged'],n=S.length||1;
  $('#bar').innerHTML=keys.map(k=>`<i style="width:${cnt(k)/n*100}%;background:${COL[k]}"></i>`).join('');
  $('#legend').innerHTML=keys.map(k=>`<span><s style="background:${COL[k]}"></s>${k[0].toUpperCase()+k.slice(1)} ${cnt(k)}</span>`).join('');
  $('#alert').innerHTML=D.errors.length?`<div class="alert"><b>Some data could not be read</b><pre>${esc(D.errors.join('\n'))}</pre></div>`:'';
  zones();drawMap();sites();lists();stats();
}

function zones(){
  $('#zones').innerHTML=D.zones.map(z=>{
    const id=z.name,s=D.sites.filter(x=>g(x,'zone')===id),t=D.trees.filter(x=>g(x,'zone')===id),p=s.filter(x=>low(g(x,'status'))==='planned').length;
    return `<button class="zc" data-z="${esc(id)}"><h3>${esc(g(z,'name'))}</h3><p>${t.length} trees · ${s.length} sites</p>${p?`<span class="tag">${p} planned</span>`:''}</button>`}).join('')||'<div class="empty">No zones yet.</div>';
  document.querySelectorAll('.zc').forEach(b=>b.onclick=()=>{zoneF=b.dataset.z;drawMap();$('#all').classList.remove('on')});
}

function drawMap(){
  if(!map){map=L.map('map').setView([12.9716,77.5946],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map)}
  layer.clearLayers();const pts=[];
  const add=(r,kind)=>{const la=parseFloat(g(r,'lat')),ln=parseFloat(g(r,'lng'));if(!la||!ln||(zoneF&&g(r,'zone')!==zoneF))return;
    L.circleMarker([la,ln],{radius:kind==='tree'?7:9,color:'#fff',weight:2,fillColor:col(g(r,'status')||'identified'),fillOpacity:1}).addTo(layer)
     .bindPopup(`<b>${esc(g(r,'name'))}</b><br>${esc(g(r,'status')||kind)}`);pts.push([la,ln])};
  D.sites.forEach(r=>add(r,'site'));D.trees.forEach(r=>add(r,'tree'));
  if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:16});
}

const STAT=['Identified','Planned','Completed','Monitoring'];
function sites(){
  const sts=['All',...new Set(D.sites.map(s=>g(s,'status')).filter(Boolean)),'Mine'];
  $('#chips').innerHTML=sts.map(s=>`<button class="pill ${s===siteF?'on':''}" data-f="${esc(s)}">${esc(s)}</button>`).join('');
  document.querySelectorAll('#chips .pill').forEach(b=>b.onclick=()=>{siteF=b.dataset.f;sites()});
  const rows=D.sites.filter(s=>siteF==='All'||(siteF==='Mine'?s.owner===D.me:g(s,'status')===siteF));
  $('#sites').innerHTML=rows.map(s=>{
    const st=g(s,'status'),ty=g(s,'type'),bc=low(ty)==='stretch'?'#d97706':'#2563eb',tc=D.trees.filter(t=>g(t,'site')===s.name).length,pr=g(s,'prio');
    return `<div class="card" style="--bc:${bc}"><div class="ch">${ty?`<span class="type">${esc(ty)}</span>`:''}<h3>${esc(g(s,'name'))}</h3>${st?`<span class="badge" style="--b:${col(st)}">${esc(st)}</span>`:''}</div>
    <div class="sub">${esc(g(s,'addr'))}${g(s,'addr')?' · ':''}${tc} trees</div>
    ${g(s,'note')?`<div class="note">${esc(g(s,'note'))}</div>`:''}
    <div class="meta"><span class="code">${esc(s.name)}</span>${pr?`<span style="color:${low(pr)==='high'?'#dc2626':'#16a34a'}">● ${esc(pr)}</span>`:''}</div>
    ${D.is_admin?`<div class="acts"><a href="/desk/hr-site/${encodeURIComponent(s.name)}">Edit</a>${STAT.map(x=>`<button data-s="${esc(s.name)}" data-v="${x}" class="${low(st)===low(x)?'on':''}">${x}</button>`).join('')}</div>`:''}</div>`}).join('')||'<div class="empty">No sites here yet.</div>';
  document.querySelectorAll('.acts button').forEach(b=>b.onclick=async()=>{
    b.disabled=true;await fetch(`/api/method/hasiruratha.dashboard_api.set_status?name=${encodeURIComponent(b.dataset.s)}&status=${b.dataset.v}`);load()});
}

function lists(){
  const mine=D.is_admin?D.trees:D.trees.filter(t=>t.owner===D.me);
  $('#th').textContent=D.is_admin?'All trees':'My trees';
  $('#trees').innerHTML=mine.map(t=>`<div class="card" style="--bc:${col(g(t,'status'))}"><div class="ch"><h3>${esc(g(t,'name'))}</h3>${g(t,'status')?`<span class="badge" style="--b:${col(g(t,'status'))}">${esc(g(t,'status'))}</span>`:''}</div><div class="sub">${esc(g(t,'species'))} ${esc(g(t,'site'))}</div></div>`).join('')||'<div class="empty">No trees yet. Tap + to plant one.</div>';
  $('#team').innerHTML=D.volunteers.map(v=>{const nm=String(g(v,'name')),st=g(v,'status')||'Active',n=D.trees.filter(t=>t.owner===v.owner).length;
    return `<div class="card person"><div class="av">${esc(nm.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</div><div><div class="ch"><h3>${esc(nm)}</h3><span class="badge" style="--b:${col(st)}">${esc(st)}</span></div>
    <div class="sub">${esc(g(v,'phone'))}<br>${esc(g(v,'email'))}<br>${esc(g(v,'zone')||g(v,'addr'))}</div><div class="meta">Joined ${esc(String(v.creation||'').slice(0,10))}</div></div></div>`}).join('')||'<div class="empty">No volunteers yet.</div>';
}

function stats(){
  const c={};D.sites.forEach(s=>{const k=g(s,'status')||'Unknown';c[k]=(c[k]||0)+1});
  const z=D.zones.map(x=>[g(x,'name'),D.trees.filter(t=>g(t,'zone')===x.name).length]);
  const m1=Math.max(1,...Object.values(c)),m2=Math.max(1,...z.map(a=>a[1]));
  const row=(l,v,m,cl)=>`<div class="sr"><span>${esc(l)}</span><div><i style="width:${v/m*100}%;background:${cl}"></i></div><b>${v}</b></div>`;
  $('#stats').innerHTML='<h3>Sites by status</h3>'+Object.entries(c).map(([k,v])=>row(k,v,m1,col(k))).join('')+'<h3 style="margin-top:20px">Trees by zone</h3>'+(z.map(a=>row(a[0],a[1],m2,'#0b4a34')).join('')||'<div class="empty">No zones yet.</div>');
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='map')setTimeout(()=>map&&map.invalidateSize(),50)});
$('#all').onclick=()=>{zoneF=null;$('#all').classList.add('on');$('#near').classList.remove('on');drawMap()};
$('#near').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{$('#near').classList.add('on');$('#all').classList.remove('on');map.setView([p.coords.latitude,p.coords.longitude],16)},()=>alert('Allow location access to see trees near you.'));
$('#refresh').onclick=load;
$('#out').onclick=()=>fetch('/api/method/logout',{method:'POST',headers:{'X-Frappe-CSRF-Token':window.csrf_token}}).then(()=>location='/hasiruratha');
load();
</script>
</body>
</html>
